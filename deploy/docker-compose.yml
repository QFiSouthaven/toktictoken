services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: openclaw:latest
    container_name: openclaw-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /data
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      LM_STUDIO_URL: ${LM_STUDIO_URL:-http://host.docker.internal:1234}
      COOKIE_SECURE: "true"
    volumes:
      - openclaw_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "3000"
    networks:
      - openclaw

  caddy:
    image: caddy:2-alpine
    container_name: openclaw-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - openclaw

volumes:
  openclaw_data:
  caddy_data:
  caddy_config:

networks:
  openclaw:
    driver: bridge
