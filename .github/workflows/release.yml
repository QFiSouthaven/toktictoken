name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - name: Pack Windows bundle
        run: SKIP_ZIP=1 npm run pack

      - name: Create zip
        run: |
          cd dist-bundle
          zip -rq openclaw-windows-x64.zip openclaw
          ls -lh openclaw-windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-windows-x64
          path: dist-bundle/openclaw-windows-x64.zip
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-bundle/openclaw-windows-x64.zip
          generate_release_notes: true
          draft: false
          prerelease: false
